name: Argon Android Developer & APK Builder

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Was soll Argon in der App bauen oder ändern?'
        required: true
        type: string

permissions:
  contents: write

jobs:
  develop-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Node.js & Gemini CLI installieren
        run: npm install -g @google/gemini-cli@latest

      - name: Argon das Projekt komplett von Grund auf erstellen lassen
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CI: ""
        run: |
          gemini -m gemini-4-argon --skip-trust --yolo -p "Du bist ein Senior Android Developer (Kotlin, Jetpack Compose). 
          Analysiere das aktuelle Repository. Falls es leer ist, erstelle eine komplette Android-Projektstruktur von Grund auf (Gradle-Dateien, AndroidManifest.xml, MainActivity.kt und UI-Code mit Jetpack Compose).
          Setze folgenden App-Wunsch um: ${{ inputs.prompt }}."

      - name: App kompilieren (APK bauen)
        run: |
          chmod +x ./gradlew || true
          ./gradlew assembleDebug

      - name: Code ins Repo pushen
        run: |
          git config user.name "gemini-argon-bot"
          git config user.email "bot@github.com"
          git add .
          git diff --staged --quiet || (git commit -m "feat(ai): ${{ inputs.prompt }}" && git push)

      - name: Direkt-Download als GitHub Release erstellen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="build-$(date +%Y%m%d-%H%M%S)"
          gh release create "$TAG_NAME" app/build/outputs/apk/debug/app-debug.apk \
            --title "Argon Build: $TAG_NAME" \
            --notes "Automatisch gebaut für Prompt: ${{ inputs.prompt }}"
